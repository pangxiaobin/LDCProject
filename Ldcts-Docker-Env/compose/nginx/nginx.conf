# compose/nginx/nginx.conf

upstream ldcts-web {
    server web:8010; # Docker-compose web服务端口
}

server {
    listen 80; # 监听80端口
    server_name 127.0.0.1; # 可以是nginx容器所在ip地址或127.0.0.1，不能写宿主机外网ip地址

    charset utf-8;
    client_max_body_size 400M; # 限制用户上传文件大小

    # resolver_timeout 5s;
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains";
    # add_header X-Frame-Options DENY; 
    add_header X-Content-Type-Options nosniff;
    proxy_hide_header Allow;

    proxy_set_header        Host $host:$server_port;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-Host $host;
    #proxy_set_header        X-Forwarded-Port $server_port;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        X-Forwarded-Scheme $scheme;
    proxy_set_header        X-Scheme $scheme;
    # proxy_http_version      1.1;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_redirect          off;
    uwsgi_read_timeout      500;
    uwsgi_send_timeout      500;
    proxy_connect_timeout   500;
    proxy_read_timeout      500;
    proxy_send_timeout      500;
    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 3;
    gzip_types text/plain application/javascript application/json application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    
    # 放开url限制
    proxy_buffer_size   128k;
    proxy_buffers   4 256k;
    proxy_busy_buffers_size   256k;


    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    location /api {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120;
        # rewrite /ldcts(.*) $1 break;
        proxy_pass http://ldcts-web;
    }

    location /swagger {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120;
        proxy_pass http://ldcts-web;
    }

    location /png/ {
        alias /var/www/png/;
    }

    location / {
        alias /var/www/front_end/ldcts/dist/;
        index index.html;
        autoindex on;
        try_files $uri $uri/ /index.html =404;
    }
}
